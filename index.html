<!DOCTYPE html>
<html>
<head>
    <title>JIM FRICKE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
        }
        
        /* Mobile: Full screen, cropped to fit */
        img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
        
        /* PC: Scaled down, no rounded corners */
        @media (min-width: 768px) {
            img {
                width: 90%;
                max-width: 500px;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <img src="hhhfgcb.jpeg" alt="Photo">
</body>
</html>
