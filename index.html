<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

            width: 85%; /* Scales naturally to leave comfortable "wide" borders on mobile */

        h1 {
            font-weight: 300; 
            text-transform: uppercase;

            font-size: 20px;
